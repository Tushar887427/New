name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages (API 36)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          sdkmanager --list_installed

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Generate Gradle wrapper (missing from AI Studio export)
        run: gradle wrapper --gradle-version 9.3.1

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::Build failed. Key errors:"
            grep -iE "error:|e: |FAILED|What went wrong|Could not|Execution failed" build.log | head -n 40 || true
            exit $status
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Worked-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
